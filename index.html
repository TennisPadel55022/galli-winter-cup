<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#22509E">
<meta name="apple-mobile-web-app-title" content="GWC">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Galli Winter Cup · Tennis &amp; Padel Club Bagni di Lucca</title>
<style>
:root{
  --giallo:#F2B630; --giallo-chiaro:#FDF3D6; --giallo-scuro:#B98408;
  --blu:#15244A; --blu-medio:#22509E; --azzurro:#3C8DDB; --azzurro-chiaro:#E7F1FC;
  --bianco:#FFFFFF; --sfondo:#F4F7FB; --linea:#D6DFEC; --testo:#15244A; --testo-soft:#56627C;
  --verde:#1E7F49;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--sfondo);color:var(--testo);line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Arial,Helvetica,sans-serif;margin:0;line-height:1.15}
p{margin:0}
.giust{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
button{font-family:Arial,Helvetica,sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:Arial,Helvetica,sans-serif;font-size:16px;color:var(--testo)}
:focus-visible{outline:3px solid var(--azzurro);outline-offset:2px}

/* ---------- Testata ---------- */
.hdr{background:var(--bianco);border-bottom:4px solid var(--giallo);position:sticky;top:0;z-index:20}
.hdr-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-align:left;padding:0}
.brand img{width:46px;height:46px}
.brand .b1{display:block;font-weight:700;font-size:1.08rem;color:var(--blu)}
.brand .b2{display:block;font-size:.8rem;color:var(--testo-soft)}
.hdr-r{display:flex;align-items:center;gap:10px}
.lg-club{width:50px;height:50px;display:block}
.who{font-size:.85rem;color:var(--testo-soft)}

/* ---------- Pulsanti ---------- */
.btn{background:var(--blu-medio);color:#fff;font-weight:700;padding:11px 16px;border-radius:8px;font-size:.95rem;min-height:44px}
.btn:hover{background:var(--blu)}
.btn.sm{padding:8px 12px;font-size:.85rem;min-height:38px}
.btn.ghost{background:transparent;color:var(--blu-medio);border:2px solid var(--blu-medio)}
.btn.ghost:hover{background:var(--azzurro-chiaro)}
.btn.gold{background:var(--giallo);color:var(--blu)}
.btn.gold:hover{background:#E5A715}
.btn.danger{background:transparent;color:#B3261E;border:2px solid #B3261E}
.icon-btn{width:38px;height:38px;border-radius:8px;color:#B3261E;font-size:1.1rem;font-weight:700}
.icon-btn:hover{background:#FBE9E7}

main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--blu);color:#fff;padding:30px 28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(90deg,transparent calc(50% - 1.5px),rgba(255,255,255,.12) calc(50% - 1.5px),rgba(255,255,255,.12) calc(50% + 1.5px),transparent calc(50% + 1.5px)),
   linear-gradient(0deg,transparent 18%,rgba(255,255,255,.12) 18%,rgba(255,255,255,.12) calc(18% + 3px),transparent calc(18% + 3px),transparent 82%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.12) calc(82% + 3px),transparent calc(82% + 3px))}
.hero-logo{position:relative;width:190px;height:190px}
.hero-logo img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hero-txt{position:relative;max-width:620px}
.hero h1{font-size:2.6rem;font-weight:700;letter-spacing:-.01em;color:var(--giallo)}
.hero .sub{display:flex;align-items:center;gap:10px;margin:10px 0 14px;font-size:1.02rem;font-weight:700}
.hero .sub img{width:44px;height:44px;border-radius:50%;background:#fff}
.hero .giust{color:#DCE6F5;font-size:1rem}

.sez{font-size:1.35rem;font-weight:700;margin:34px 0 14px;color:var(--blu);display:flex;align-items:center;gap:10px}
.sez::after{content:"";flex:1;height:3px;background:var(--linea);border-radius:2px}

.grid-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tcard{position:relative;background:var(--bianco);border:2px solid var(--linea);border-radius:16px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:200px;overflow:hidden;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--azzurro);transform:translateY(-2px)}
.tcard .ticon{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px;position:relative}
.tcard .ticon svg{width:44px;height:44px}
.tcard .tname{font-size:1.15rem;font-weight:700;color:var(--blu)}
.tcard .tmeta{font-size:.86rem;color:var(--testo-soft)}
.tcard .badge{margin-top:auto;align-self:flex-start}
.liv-gold .ticon{background:var(--giallo);color:var(--blu)}
.liv-silver .ticon{background:#D9E0EA;color:var(--blu)}
.liv-senior .ticon{background:var(--azzurro);color:#fff}
.liv-junior .ticon{background:var(--azzurro-chiaro);color:var(--blu-medio);border:2px solid var(--azzurro)}
.liv-top .ticon{background:var(--blu);color:var(--giallo)}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--azzurro-chiaro);color:var(--blu-medio)}
.badge.prep{background:#EEF1F5;color:var(--testo-soft)}
.badge.fin{background:var(--giallo-chiaro);color:var(--giallo-scuro)}
.badge.camp{background:var(--giallo);color:var(--blu)}

/* ---------- Pagina torneo ---------- */
.tbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tbar h1{font-size:1.9rem;font-weight:700;color:var(--blu);display:flex;align-items:center;gap:12px}
.tbar h1 .mini{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.tbar h1 .mini svg{width:28px;height:28px}
.tbar .spacer{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;border-bottom:2px solid var(--linea);scrollbar-width:none}
.tabs button{padding:12px 16px;font-weight:700;font-size:.95rem;color:var(--testo-soft);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--blu);border-bottom-color:var(--giallo)}

.vuoto{background:var(--bianco);border:2px dashed var(--linea);border-radius:14px;padding:30px 22px;color:var(--testo-soft);max-width:680px}
.vuoto strong{color:var(--blu);display:block;margin-bottom:6px;font-size:1.05rem}

.grid-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px}
.girone{background:var(--bianco);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.girone-h{display:flex;justify-content:space-between;align-items:center;background:var(--blu);color:#fff;padding:12px 16px}
.girone-h h3{font-size:1.1rem}
.girone-h span{font-size:.82rem;color:#C9D6EC}
.tab-cl{width:100%;border-collapse:collapse;font-size:.9rem}
.tab-cl th{font-size:.75rem;color:var(--testo-soft);font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid var(--linea)}
.tab-cl th.l,.tab-cl td.l{text-align:left}
.tab-cl td{text-align:center;padding:9px 4px;border-bottom:1px solid #EDF1F7}
.tab-cl td.pos{width:34px;font-weight:700;color:var(--testo-soft)}
.tab-cl td.nm{font-weight:700;word-break:break-word}
.tab-cl tr.q td{background:var(--giallo-chiaro)}
.tab-cl tr.q td.pos{color:var(--giallo-scuro);box-shadow:inset 4px 0 0 var(--giallo)}
.tab-cl td.v{font-weight:700;color:var(--blu-medio)}
.leg{font-size:.78rem;color:var(--testo-soft);padding:8px 16px 0;display:flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:12px;height:12px;background:var(--giallo);border-radius:3px}
.giornata{padding:12px 16px 4px;font-size:.8rem;font-weight:700;color:var(--azzurro)}
.partite{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}

.match{border:1px solid var(--linea);border-radius:10px;background:var(--bianco);overflow:hidden}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;min-height:46px}
.mrow + .mrow{border-top:1px solid #EDF1F7}
.mrow .mn{font-size:.92rem;flex:1;min-width:0;overflow-wrap:anywhere}
.mrow.win{background:var(--azzurro-chiaro)}
.mrow.win .mn{font-weight:700;color:var(--blu)}
.mrow.win .mn::after{content:" ✓";color:var(--verde)}
.mrow.lose .mn{color:var(--testo-soft)}
.mset{display:flex;gap:5px}
.sc{width:40px;height:38px;text-align:center;border:1px solid var(--linea);border-radius:7px;background:#FAFCFF;font-size:16px;font-weight:700;padding:0}
.sc:focus{border-color:var(--azzurro);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(60,141,219,.25)}
.scv{width:30px;text-align:center;font-weight:700;font-size:.95rem}
.match .mfoot{font-size:.75rem;color:var(--testo-soft);padding:4px 12px;background:#F7F9FC;border-top:1px solid #EDF1F7}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}

/* ---------- Tabellone ---------- */
.turno{margin-bottom:24px}
.turno h3{font-size:1.1rem;color:var(--blu);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.turno h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--giallo);box-shadow:0 0 0 3px var(--giallo-chiaro)}
.grid-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.turno.finale .match{border:2px solid var(--giallo)}
.campione{background:var(--blu);color:#fff;border-radius:16px;padding:22px;display:flex;align-items:center;gap:18px;margin-top:10px}
.campione img{width:84px;height:84px}
.campione .l{color:var(--giallo);font-weight:700;font-size:.9rem}
.campione .n{font-size:1.7rem;font-weight:700}

/* ---------- Calendario ---------- */
.cal-form{background:var(--bianco);border:1px solid var(--linea);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.cal-form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--testo-soft)}
.cal-form .w2{grid-column:span 2}.cal-form .w4{grid-column:span 4}.cal-form .w6{grid-column:span 6}
.fld{width:100%;padding:10px;border:1px solid var(--linea);border-radius:8px;background:#FAFCFF;min-height:44px}
.cal-day{font-weight:700;color:var(--blu-medio);margin:18px 0 8px;text-transform:capitalize}
.cal-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;background:var(--bianco);border:1px solid var(--linea);border-left:5px solid var(--azzurro);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cal-row.pass{opacity:.55}
.cal-row .ora{font-weight:700;font-size:1.1rem;color:var(--blu)}
.cal-row .inc{font-weight:700}
.cal-row .det{font-size:.82rem;color:var(--testo-soft)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--giallo-chiaro);color:var(--giallo-scuro);margin-right:6px}

/* ---------- Impostazioni ---------- */
.pan{background:var(--bianco);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:18px}
.pan h3{font-size:1.05rem;margin-bottom:12px;color:var(--blu)}
.frm{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--testo-soft)}
.info{margin-top:12px;font-size:.9rem;background:var(--azzurro-chiaro);color:var(--blu);padding:10px 12px;border-radius:8px}
.prow{display:grid;grid-template-columns:34px 1fr 130px 38px;gap:8px;align-items:center;margin-bottom:8px}
.prow .n{font-weight:700;color:var(--testo-soft);text-align:right}
.gsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gsum span{font-size:.82rem;background:#EEF1F5;border-radius:6px;padding:4px 10px}

/* ---------- Modale e avvisi ---------- */
.ov{position:fixed;inset:0;background:rgba(21,36,74,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mod{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto}
.mod h2{font-size:1.25rem;margin-bottom:14px}
.mod .fld{margin-bottom:10px}
.mod .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.mod .err{color:#B3261E;font-size:.88rem;margin-bottom:8px}
.ulist{list-style:none;padding:0;margin:0 0 16px}
.ulist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EDF1F7}
.nota{font-size:.82rem;color:var(--testo-soft);margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--blu);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.err{background:#B3261E}
.locale{background:var(--giallo-chiaro);color:var(--giallo-scuro);font-size:.86rem;padding:8px 18px;text-align:center}

/* ---------- Piè di pagina ---------- */
.foot{border-top:4px solid var(--giallo);background:var(--bianco)}
.foot-in{max-width:1180px;margin:0 auto;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;font-size:.85rem;color:var(--testo-soft)}
.foot-in .club{display:flex;align-items:center;gap:10px}
.foot-in .club img{width:46px;height:46px}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  .who{display:none}
  .hdr-r{gap:6px}
  .hdr-r .btn.sm{padding:6px 10px;font-size:.8rem;min-height:34px}
  .hdr-in{padding:8px 12px}
  .brand img{width:40px;height:40px}
  .brand .b2{display:none}
  .brand .b1{font-size:.95rem;white-space:nowrap}
  .lg-club{width:42px;height:42px}
    .who{display:none}
  main{padding:16px 12px 50px}
  .hero{grid-template-columns:92px 1fr;padding:18px 16px;gap:14px;align-items:start}
  .hero-logo{width:92px;height:92px}
  .hero h1{font-size:1.6rem}
  .hero .sub{font-size:.9rem;margin:6px 0 10px}.hero .sub img{width:34px;height:34px}
  .hero .giust{font-size:.92rem}
  .grid-t{grid-template-columns:1fr;gap:10px}
  .tcard{min-height:0;padding:14px 40px 14px 14px;display:grid;grid-template-columns:68px 1fr;column-gap:14px;row-gap:3px;align-items:center}
  .tcard::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:2rem;line-height:1;color:var(--azzurro)}
  .tcard .ticon{grid-row:1 / span 3;width:68px;height:68px;margin:0}.tcard .ticon svg{width:40px;height:40px}
  .tcard .tname{font-size:1.15rem}
  .tcard .badge{margin-top:2px;justify-self:start}
  .tcard:active{border-color:var(--azzurro);background:var(--azzurro-chiaro)}
  .sez{font-size:1.2rem;margin:24px 0 12px}
  .grid-g{grid-template-columns:1fr}
  .tab-cl{font-size:.84rem}
  .tbar h1{font-size:1.45rem}
  .cal-form{grid-template-columns:1fr 1fr}
  .cal-form .w2,.cal-form .w4,.cal-form .w6{grid-column:span 2}
  .cal-row{grid-template-columns:58px 1fr auto}
  .prow{grid-template-columns:26px 1fr 96px 38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function esito(set){
  let sa=0,sb=0,ga=0,gb=0;
  for(const [x,y] of set){
    if(sa===2||sb===2)break;
    if(x===''||y==='')continue;
    const a=+x,b=+y;if(isNaN(a)||isNaN(b)||a===b)continue;
    ga+=a;gb+=b;if(a>b)sa++;else sb++;
  }
  return {sa,sb,ga,gb,fine:sa===2||sb===2,vinc:sa===2?'a':sb===2?'b':null};
}
function generaPartite(t){
  t.partite=[];let id=1;
  for(let g=0;g<t.nGironi;g++){
    const l=[...membri(t,g)];if(l.length%2)l.push(null);
    const n=l.length;
    for(let r=0;r<n-1;r++){
      for(let i=0;i<n/2;i++){const a=l[i],b=l[n-1-i];if(a!==null&&b!==null)t.partite.push({id:id++,g,giornata:r+1,a,b,set:vuoti()});}
      l.splice(1,0,l.pop());
    }
  }
  t.tabellone=null;t.stato='gironi';
}
function scontro(t,x,y){
  const m=t.partite.find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x));if(!m)return 0;
  const e=esito(m.set);if(!e.fine)return 0;
  const vx=(e.vinc==='a'&&m.a===x)||(e.vinc==='b'&&m.b===x);return vx?-1:1;
}
function classifica(t,g){
  const rows={};membri(t,g).forEach(id=>rows[id]={id,g:0,v:0,p:0,sv:0,sp:0,gv:0,gp:0});
  t.partite.filter(m=>m.g===g).forEach(m=>{
    const e=esito(m.set);if(!e.fine)return;const A=rows[m.a],B=rows[m.b];if(!A||!B)return;
    A.g++;B.g++;if(e.vinc==='a'){A.v++;B.p++;}else{B.v++;A.p++;}
    A.sv+=e.sa;A.sp+=e.sb;B.sv+=e.sb;B.sp+=e.sa;A.gv+=e.ga;A.gp+=e.gb;B.gv+=e.gb;B.gp+=e.ga;
  });
  return Object.values(rows).sort((x,y)=>y.v-x.v||(y.sv-y.sp)-(x.sv-x.sp)||(y.gv-y.gp)-(x.gv-x.gp)||scontro(t,x.id,y.id)||nome(t,x.id).localeCompare(nome(t,y.id)));
}
function nomeTurno(n){return {16:'Sedicesimi di finale',8:'Ottavi di finale',4:'Quarti di finale',2:'Semifinali',1:'Finale'}[n]||`Turno da ${n*2}`;}
function infoFase(t){
  let Q=0;for(let g=0;g<t.nGironi;g++)Q+=Math.min(t.qualificati,membri(t,g).length);
  if(Q<2)return {Q,txt:'Servono almeno 2 qualificati per la fase finale.'};
  if((t.id==='top'||t.id==='intermedio-silver')&&t.nGironi===3&&t.qualificati===3&&Q===9)return {Q,S:16,txt:'9 qualificati: un ottavo di finale tra le due peggiori terze classificate, poi quarti con 8 squadre.'};
  let S2=2;while(S2<Q)S2*=2;const bye=S2-Q;
  return {Q,S:S2,txt:`${Q} qualificati: la fase finale parte ${({1:'dalla',2:'dalle',4:'dai',8:'dagli',16:'dai'})[S2/2]||'da'} ${nomeTurno(S2/2).toLowerCase().replace(' di finale','')}${bye?` con ${bye} passaggi${bye===1?'o':''} dirett${bye===1?'o':'i'} al turno successivo`:''}.`};
}
function seedOrder(n){let o=[1,2];while(o.length<n){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s]);}return o;}
function tnome(t,r){return (t.tabellone.nomi&&t.tabellone.nomi[r])||nomeTurno(t.tabellone.rounds[r].length);}
/* Classifiche "normalizzate" per confrontare squadre di gironi di dimensione diversa:
   nei gironi più grandi si escludono i risultati con gli ultimi classificati, così tutte hanno lo stesso numero di partite. */
function statNorm(t){
  const cls=[...Array(t.nGironi).keys()].map(g=>classifica(t,g));
  const mn=Math.min(...cls.map(c=>c.length)),out={};
  cls.forEach((c,g)=>{
    const ex=new Set(c.slice(mn).map(r=>r.id));
    c.forEach(r=>{out[r.id]={id:r.id,g,v:0,sv:0,sp:0,gv:0,gp:0};});
    t.partite.filter(m=>m.g===g).forEach(m=>{
      const e=esito(m.set);if(!e.fine||ex.has(m.a)||ex.has(m.b))return;
      const A=out[m.a],B=out[m.b];if(e.vinc==='a')A.v++;else B.v++;
      A.sv+=e.sa;A.sp+=e.sb;B.sv+=e.sb;B.sp+=e.sa;A.gv+=e.ga;A.gp+=e.gb;B.gv+=e.gb;B.gp+=e.ga;
    });
  });
  return {cls,out};
}
const cmpN=(a,b)=>b.v-a.v||(b.sv-b.sp)-(a.sv-a.sp)||(b.gv-b.gp)-(a.gv-a.gp)||a.g-b.g;
function permutazioni(n){const P=[];(function pm(a,b){if(!a.length){P.push(b);return;}a.forEach((x,i)=>pm(a.filter((_,j)=>j!==i),[...b,x]));})([...Array(n).keys()],[]);return P;}
/* Intermedio Gold: 4 gironi, passano i primi 2 (8 qualificati) -> quarti. Teste di serie: 4 prime, poi 4 seconde (1-8, 4-5, 2-7, 3-6). */
function generaTabelloneGold(t){
  const {cls,out}=statNorm(t);
  if(cls.some(c=>c.length<2))return false;
  const W=cls.map(c=>out[c[0].id]).sort(cmpN),S=cls.map(c=>out[c[1].id]).sort(cmpN);
  const Wo=[W[0],W[3],W[1],W[2]],Sd=[S[3],S[0],S[2],S[1]];
  let best=null,bc=1e9;
  permutazioni(4).forEach(p=>{let c=0;p.forEach((pi,k)=>{if(Wo[k].g===Sd[pi].g)c+=100;if(pi!==k)c++;});if(c<bc){bc=c;best=p;}});
  const r0=best.map((pi,k)=>({a:Wo[k].id,b:Sd[pi].id,set:vuoti(),vinc:null}));
  const mk=n=>Array.from({length:n},()=>({a:null,b:null,set:vuoti(),vinc:null}));
  t.tabellone={rounds:[r0,mk(2),mk(1)]};propaga(t);t.stato='finale';return true;
}
/* Top e Intermedio Silver: 3 gironi da 4, passano i primi 3 (9 qualificati). Le 2 peggiori terze giocano l'ottavo di finale;
   la vincente entra nei quarti con le altre 7 (3 prime, 3 seconde, migliore terza). */
function generaTabelloneTop(t){
  const cls=[0,1,2].map(g=>classifica(t,g));
  if(cls.some(c=>c.length<3))return false;
  const grp=id=>t.assegnazione[id];
  const cmp=(x,y)=>y.v-x.v||(y.sv-y.sp)-(x.sv-x.sp)||(y.gv-y.gp)-(x.gv-x.gp)||grp(x.id)-grp(y.id);
  const pos=p=>cls.map(c=>c[p]).sort(cmp);
  const win=pos(0),sec=pos(1),ter=pos(2);
  const E=[...win,...sec,ter[0]].map(r=>({id:r.id,gr:[grp(r.id)]}));
  E.push({id:null,gr:[grp(ter[1].id),grp(ter[2].id)],ow:true});
  const D=[E[0],E[7],E[3],E[4],E[1],E[6],E[2],E[5]];
  const perms=[];(function pm(a,b){if(!a.length){perms.push(b);return;}a.forEach((x,i)=>pm(a.filter((_,j)=>j!==i),[...b,x]));})([0,1,2,3,4,5,6,7],[]);
  let best=null,bc=1e9;
  perms.forEach(p=>{let c=0;for(let k=0;k<8;k+=2){const x=D[p[k]],y=D[p[k+1]];c+=100*x.gr.filter(g=>y.gr.includes(g)).length;}
    p.forEach((pi,k)=>{if(pi!==k)c++;});if(c<bc){bc=c;best=p;}});
  const arr=best.map(pi=>D[pi]);
  const r0=[{a:ter[1].id,b:ter[2].id,set:vuoti(),vinc:null}];
  const r1=[];for(let k=0;k<8;k+=2){const x=arr[k],y=arr[k+1];
    r1.push({a:null,b:null,fa:x.ow?null:x.id,oa:x.ow?0:null,fb:y.ow?null:y.id,ob:y.ow?0:null,set:vuoti(),vinc:null});}
  const mk=n=>Array.from({length:n},()=>({a:null,b:null,set:vuoti(),vinc:null}));
  t.tabellone={rounds:[r0,r1,mk(2),mk(1)],custom:true,nomi:['Ottavo di finale','Quarti di finale','Semifinali','Finale']};
  propaga(t);t.stato='finale';return true;
}
function generaTabellone(t){
  if((t.id==='top'||t.id==='intermedio-silver')&&t.nGironi===3&&t.qualificati===3)return generaTabelloneTop(t);
  if(t.id==='intermedio-gold'&&t.nGironi===4&&t.qualificati===2)return generaTabelloneGold(t);
  const q=[];
  for(let pos=0;pos<t.qualificati;pos++)for(let g=0;g<t.nGironi;g++){const c=classifica(t,g);if(c[pos])q.push(c[pos].id);}
  const Q=q.length;if(Q<2)return false;
  let N=2;while(N<Q)N*=2;
  const slot=seedOrder(N).map(s=>s<=Q?q[s-1]:null);
  const r0=[];for(let i=0;i<N;i+=2)r0.push({a:slot[i],b:slot[i+1],set:vuoti(),vinc:null});
  const grp=id=>t.assegnazione[id];
  for(let i=0;i<r0.length;i++){const m=r0[i];
    if(m.a!=null&&m.b!=null&&grp(m.a)===grp(m.b)){
      for(let j=0;j<r0.length;j++){if(j===i)continue;const o=r0[j];if(o.a==null||o.b==null)continue;
        if(grp(m.a)!==grp(o.b)&&grp(o.a)!==grp(m.b)){[m.b,o.b]=[o.b,m.b];break;}}}}
  const rounds=[r0];for(let n=N/4;n>=1;n/=2)rounds.push(Array.from({length:n},()=>({a:null,b:null,set:vuoti(),vinc:null})));
  t.tabellone={rounds};propaga(t);t.stato='finale';return true;
}
function propaga(t){
  const R=t.tabellone.rounds;
  for(let r=0;r<R.length;r++)R[r].forEach((m,i)=>{
    if(r>0){let na,nb;if(t.tabellone.custom&&r===1){const sd=(f,o)=>f!=null?f:(o!=null?R[0][o].vinc:null);na=sd(m.fa,m.oa);nb=sd(m.fb,m.ob);}else{na=R[r-1][2*i].vinc;nb=R[r-1][2*i+1].vinc;}if(m.a!==na||m.b!==nb){m.a=na;m.b=nb;m.set=vuoti();}}
    m.bye=false;let v=null;
    if(r===0&&((m.a===null)!==(m.b===null))){v=m.a??m.b;m.bye=true;}
    else if(m.a!==null&&m.b!==null){const e=esito(m.set);v=e.vinc==='a'?m.a:e.vinc==='b'?m.b:null;}
    m.vinc=v;
  });
}
function campione(t){if(!t.tabellone)return null;const R=t.tabellone.rounds;return R[R.length-1][0].vinc;}
function stato(t){
  const c=campione(t);
  if(c!==null&&c!==undefined)return {cls:'camp',txt:`Vincitore: ${nome(t,c)}`};
  if(t.stato==='finale')return {cls:'fin',txt:'Fase finale in corso'};
  if(t.stato==='gironi'){const g=t.partite.filter(m=>esito(m.set).fine).length;return {cls:'',txt:`Gironi: ${g}/${t.partite.length} partite`};}
  return {cls:'prep',txt:'In preparazione'};
}

function matchCard(t,m,k,key,foot){
  const e=esito(m.set),editable=isOrg()&&m.a!==null&&m.b!==null&&!m.bye;
  const row=(side,id)=>{
    const win=m.vinc!==undefined?(m.vinc!==null&&m.vinc===id&&id!==null):e.vinc===side;
    const lose=(m.vinc!==undefined?m.vinc!==null:!!e.vinc)&&!win&&id!==null;
    const cells=m.bye?'':[0,1,2].map(s=>{const v=m.set[s][side==='a'?0:1];
      return editable?`<input class="sc" inputmode="numeric" maxlength="2" aria-label="Set ${s+1} ${esc(nome(t,id))}" value="${esc(v)}" data-ch="set" data-k="${k}" data-m="${key}" data-s="${s}" data-side="${side}" data-fid="${k}-${key}-${s}-${side}">`
        :`<span class="scv">${esc(v)}</span>`;}).join('');
    const label=(m.bye&&id===null)?'Passaggio diretto':nome(t,id);
    return `<div class="mrow ${win?'win':''} ${lose?'lose':''}"><span class="mn">${esc(label)}</span><span class="mset">${cells}</span></div>`;
  };
  return `<div class="match">${row('a',m.a)}${row('b',m.b)}${foot?`<div class="mfoot">${foot}</div>`:''}</div>`;
}

function vistaGironi(t){
  if(!t.partite.length)return `<div class="vuoto"><strong>Gironi in preparazione</strong><p class="giust">${isOrg()?'Apri la scheda Impostazioni per inserire i nomi, scegliere la formula e generare gironi e partite.':'Gli organizzatori stanno definendo i gironi. Torna a trovarci presto.'}</p></div>`;
  const cards=[];
  for(let g=0;g<t.nGironi;g++){
    const cl=classifica(t,g),pm=t.partite.filter(m=>m.g===g),gioc=pm.filter(m=>esito(m.set).fine).length;
    const rows=cl.map((r,i)=>`<tr class="${i<t.qualificati?'q':''}"><td class="pos">${i+1}</td><td class="l nm">${esc(nome(t,r.id))}</td><td>${r.g}</td><td class="v">${r.v}</td><td>${r.p}</td><td>${r.sv}-${r.sp}</td><td>${r.gv}-${r.gp}</td></tr>`).join('');
    const part=`<div class="partite">${pm.map(m=>matchCard(t,m,'g',m.id)).join('')}</div>`;
    cards.push(`<section class="girone"><div class="girone-h"><h3>Girone ${LETTERE[g]}</h3><span>${gioc}/${pm.length} partite giocate</span></div>
      <table class="tab-cl"><thead><tr><th></th><th class="l">${unita(t)[0][0].toUpperCase()+unita(t)[0].slice(1)}</th><th title="Giocate">G</th><th title="Vinte">V</th><th title="Perse">P</th><th>Set</th><th>Game</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="leg"><i></i>Qualificati alla fase finale (primi ${t.qualificati})</div>${part}</section>`);
  }
  const tutte=t.partite.every(m=>esito(m.set).fine);
  const tb=isOrg()?`<div class="toolbar"><button class="btn gold" data-act="gen-tab">${t.tabellone?'Rigenera il tabellone dai gironi':'Genera il tabellone della fase finale'}</button>${tutte?'':'<span class="nota">Alcune partite dei gironi non hanno ancora un risultato.</span>'}</div>`:'';
  return `${tb}<div class="grid-g">${cards.join('')}</div>`;
}

function vistaTabellone(t){
  if(!t.tabellone)return `<div class="vuoto"><strong>Tabellone non ancora disponibile</strong><p class="giust">${infoFase(t).txt} Il tabellone sarà generato al termine dei gironi.</p></div>`;
  const R=t.tabellone.rounds;
  const html=R.map((rd,r)=>`<section class="turno ${r===R.length-1?'finale':''}"><h3>${tnome(t,r)}</h3><div class="grid-k">${rd.map((m,i)=>matchCard(t,m,'k',`${r}_${i}`,m.bye?'Avanza direttamente al turno successivo':'')).join('')}</div></section>`).join('');
  const c=campione(t);
  return html+(c!==null&&c!==undefined?`<div class="campione"><img src="${LOGO_GALLI}" alt=""><div><div class="l">Vincitore ${esc(def(t.id).nome)}</div><div class="n">${esc(nome(t,c))}</div></div></div>`:'');
}

function fmtData(d){try{return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function listaCal(items,conTorneo,t){
  const oggi=new Date().toISOString().slice(0,10);let last='',out='';
  items.forEach(c=>{
    if(c.data!==last){out+=`<div class="cal-day">${esc(fmtData(c.data))}</div>`;last=c.data;}
    const det=[c.fase,c.campo,c.note].filter(Boolean).map(esc).join(', ');
    out+=`<div class="cal-row ${c.data<oggi?'pass':''}"><div class="ora">${esc(c.ora||'--:--')}</div>
      <div><div class="inc">${conTorneo?`<span class="chip">${esc(c.tn)}</span>`:''}${esc(c.incontro||'Incontro da definire')}</div>${det?`<div class="det">${det}</div>`:''}</div>
      <div>${(!conTorneo&&isOrg())?`<button class="icon-btn" title="Elimina" aria-label="Elimina" data-act="cal-del" data-id="${c.id}">✕</button>`:''}</div></div>`;
  });
  return out;
}
function incontriFase(t,fase){
  if(/^Girone /.test(fase)){const g=LETTERE.indexOf(fase.slice(7));return t.partite.filter(m=>m.g===g).map(m=>`${nome(t,m.a)} - ${nome(t,m.b)}`);}
  const out=[];if(t.tabellone)t.tabellone.rounds.forEach((rd,r)=>{if(tnome(t,r)===fase)rd.forEach(m=>{if(m.a!==null&&m.b!==null&&!m.bye)out.push(`${nome(t,m.a)} - ${nome(t,m.b)}`);});});
  return out;
}
function optIncontri(t,fase){return `<option value="">Seleziona un incontro</option>`+incontriFase(t,fase).map(x=>`<option>${esc(x)}</option>`).join('');}
function vistaCalendario(t){
  const cal=[...(t.calendario||[])].sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
  let form='';
  if(isOrg()){
    const fasi=[...Array(t.nGironi)].map((_,g)=>`Girone ${LETTERE[g]}`);
    if(t.tabellone)t.tabellone.rounds.forEach((rd,r)=>fasi.push(tnome(t,r)));else fasi.push('Fase finale');
    form=`<div class="cal-form">
      <label class="w2">Data<input class="fld" type="date" id="c-data"></label>
      <label class="w2">Ora<input class="fld" type="time" id="c-ora"></label>
      <label class="w2">Campo<select class="fld" id="c-campo"><option value="">Seleziona il campo</option><option>Campo 1</option><option>Campo 2</option><option>Campo 3</option></select></label>
      <label class="w2">Fase<select class="fld" id="c-fase">${fasi.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label>
      <label class="w4">Incontro<select class="fld" id="c-inc">${optIncontri(t,fasi[0])}</select></label>
      <label class="w6">Note<input class="fld" id="c-note" placeholder="Facoltative"></label>
      <div class="w6"><button class="btn" data-act="cal-add">Aggiungi al calendario</button></div></div>`;
  }
  return form+(cal.length?listaCal(cal,false,t):`<div class="vuoto"><strong>Calendario vuoto</strong><p class="giust">${isOrg()?'Aggiungi la prima partita con il modulo qui sopra.':'Le date delle partite saranno pubblicate qui dagli organizzatori.'}</p></div>`);
}

function vistaImpostazioni(t){
  const n=t.partecipanti.length,u=unita(t),maxG=Math.max(1,Math.min(8,Math.floor(n/2)));
  const minSize=Math.min(...[...Array(t.nGironi)].map((_,g)=>membri(t,g).length||99));
  const optG=[...Array(maxG)].map((_,i)=>`<option ${t.nGironi===i+1?'selected':''}>${i+1}</option>`).join('');
  const optQ=[1,2,3,4].map(q=>`<option ${t.qualificati===q?'selected':''}>${q}</option>`).join('');
  const optGir=id=>[...Array(t.nGironi)].map((_,g)=>`<option value="${g}" ${t.assegnazione[id]===g?'selected':''}>Girone ${LETTERE[g]}</option>`).join('');
  const rows=t.partecipanti.map((p,i)=>`<div class="prow"><span class="n">${i+1}</span>
      <input class="fld" value="${esc(p.nome)}" aria-label="Nome ${i+1}" data-ch="nome" data-id="${p.id}" data-fid="nome-${p.id}">
      <select class="fld" aria-label="Girone" data-ch="girone" data-id="${p.id}">${optGir(p.id)}</select>
      <button class="icon-btn" title="Rimuovi" aria-label="Rimuovi ${esc(p.nome)}" data-act="del-part" data-id="${p.id}">✕</button></div>`).join('');
  const gsum=[...Array(t.nGironi)].map((_,g)=>`<span>Girone ${LETTERE[g]}: ${membri(t,g).length} ${u[1]}</span>`).join('');
  return `<section class="pan"><h3>Formula del torneo</h3>
      <div class="frm"><label>Numero di gironi<select class="fld" data-ch="ngironi">${optG}</select></label>
      <label>Qualificati per girone<select class="fld" data-ch="qual">${optQ}</select></label></div>
      <div class="info">${esc(infoFase(t).txt)}${t.qualificati>minSize?' Attenzione: in qualche girone si qualificano tutti.':''}</div></section>
    <section class="pan"><h3>${u[1][0].toUpperCase()+u[1].slice(1)} (${n})</h3>${rows}
      <div class="gsum">${gsum}</div>
      <div class="toolbar"><button class="btn ghost" data-act="add-part">Aggiungi ${u[0]}</button><button class="btn ghost" data-act="distribuisci">Distribuisci automaticamente nei gironi</button></div></section>
    <section class="pan"><h3>Gironi e partite</h3>
      <p class="giust nota" style="margin:0 0 12px">${t.partite.length?`Sono già presenti ${t.partite.length} partite. Generandole di nuovo, i risultati dei gironi e il tabellone verranno azzerati. I nomi si possono correggere in qualsiasi momento senza perdere i risultati.`:'Quando nomi e gironi sono pronti, genera il calendario degli incontri di tutti i gironi.'}</p>
      <div class="toolbar" style="margin:0"><button class="btn gold" data-act="gen-partite">${t.partite.length?'Rigenera gironi e partite':'Genera gironi e partite'}</button>
      ${t.partite.length?`<button class="btn danger" data-act="reset-ris">Azzera tutti i risultati</button>`:''}</div></section>`;
}

function modal(){
  if(S.modal==='login')return `<div class="ov" data-act="chiudi-ov"><div class="mod" role="dialog" aria-label="Accesso organizzatori">
    <h2>Accesso organizzatori</h2>${S.err?`<div class="err">${esc(S.err)}</div>`:''}
    <form id="f-login" method="post" action="about:blank" target="pw-frame" autocomplete="on">
    <input class="fld" id="l-u" name="email" type="email" placeholder="Email" autocomplete="username" value="${esc(S.lastEmail||'')}">
    <input class="fld" id="l-p" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row"><button class="btn ghost" type="button" data-act="chiudi">Annulla</button><button class="btn" type="submit">Accedi</button></div></form>
    <p class="nota giust">Solo gli organizzatori possono inserire risultati, date e orari. Tutti gli altri visitatori vedono i dati in sola lettura.</p></div></div>`;
  if(S.modal==='utenti')return `<div class="ov" data-act="chiudi-ov"><div class="mod" role="dialog" aria-label="Organizzatori">
    <h2>Organizzatori</h2><ul class="ulist">${S.utenti.map(u=>`<li><span>${esc(u.u)}${u.admin?' (amministratore)':''}</span>${u.u!==S.sess.u?`<button class="icon-btn" aria-label="Rimuovi ${esc(u.u)}" data-act="del-user" data-u="${esc(u.u)}">✕</button>`:''}</li>`).join('')}</ul>
    ${S.err?`<div class="err">${esc(S.err)}</div>`:''}
    <h3 style="font-size:1rem;margin-bottom:8px">Aggiungi organizzatore</h3>
    <input class="fld" id="n-u" placeholder="Nome utente"><input class="fld" id="n-p" type="password" placeholder="Password">
    <label style="display:flex;gap:8px;align-items:center;font-size:.9rem;margin-bottom:8px"><input type="checkbox" id="n-a"> Può gestire gli organizzatori</label>
    <div class="row"><button class="btn" data-act="add-user">Aggiungi</button></div>
    <h3 style="font-size:1rem;margin:16px 0 8px">Cambia la tua password</h3>
    <input class="fld" id="c-p" type="password" placeholder="Nuova password">
    <div class="row"><button class="btn ghost" data-act="chiudi">Chiudi</button><button class="btn" data-act="cambia-pw">Salva password</button></div></div></div>`;
  return '';
}

/* ============================================================
   EVENTI
============================================================ */
const val=id=>(document.getElementById(id)||{}).value||'';
function invalidaPartite(t){t.partite=[];t.tabellone=null;t.stato='setup';}
function conferma(t,msg){return !t.partite.length||confirm(msg);}

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,t=cur();
  if(act==='chiudi-ov'&&ev.target!==el)return;
  switch(act){
    case 'home':S.vista='home';S.tid=null;window.scrollTo(0,0);render();break;
    case 'apri':S.vista='torneo';S.tid=el.dataset.id;S.tab='gironi';window.scrollTo(0,0);render();break;
    case 'tab':S.tab=el.dataset.tab;render();break;
    case 'aggiorna':await carica();render();toast(Object.values(S.offline).some(Boolean)?'Lettura non riuscita: riprova':'Dati aggiornati',Object.values(S.offline).some(Boolean));break;
    case 'login':if(!FB_OK&&!DEMO){toast('Accesso non disponibile: archivio non collegato',true);break;}S.modal='login';S.err='';render();setTimeout(()=>{const e=document.getElementById('l-u');e&&e.focus();},0);break;
    case 'chiudi':case 'chiudi-ov':S.modal=null;S.err='';render();break;
    case 'do-login':doLogin();break;
    case 'logout':if(AUTH&&!DEMO)await AUTH.signOut();S.sess=null;S.modal=null;render();toast('Sei uscito');break;
    case 'utenti':S.modal='utenti';S.err='';render();break;
    case 'add-user':{
      const u=val('n-u').trim(),p=val('n-p'),a=document.getElementById('n-a').checked;
      if(!u||p.length<4){S.err='Inserisci un nome utente e una password di almeno 4 caratteri.';render();break;}
      if(S.utenti.some(x=>x.u===u)){S.err='Esiste già un organizzatore con questo nome.';render();break;}
      S.utenti.push({u,h:hash(u+':'+p),admin:a});S.err='';await salvaUtenti();render();break;}
    case 'del-user':if(confirm(`Rimuovere l'organizzatore ${el.dataset.u}?`)){S.utenti=S.utenti.filter(x=>x.u!==el.dataset.u);await salvaUtenti();render();}break;
    case 'cambia-pw':{const p=val('c-p');if(p.length<4){S.err='La password deve avere almeno 4 caratteri.';render();break;}
      const me=S.utenti.find(x=>x.u===S.sess.u);me.h=hash(me.u+':'+p);S.err='';await salvaUtenti();S.modal=null;render();break;}
    case 'add-part':{
      if(!conferma(t,'Aggiungere un partecipante azzera le partite e il tabellone di questo torneo. Continuare?'))break;
      const id=t.prossimoId++;const lab=def(t.id).tipo==='doppio'?'Coppia':'Giocatore';
      t.partecipanti.push({id,nome:`${lab} ${t.partecipanti.length+1}`});
      const sizes=[...Array(t.nGironi)].map((_,g)=>membri(t,g).length);t.assegnazione[id]=sizes.indexOf(Math.min(...sizes));
      invalidaPartite(t);await salva(t);render();break;}
    case 'del-part':{
      const id=+el.dataset.id;if(!confirm(`Rimuovere ${nome(t,id)}?${t.partite.length?' Le partite e il tabellone di questo torneo verranno azzerati.':''}`))break;
      t.partecipanti=t.partecipanti.filter(p=>p.id!==id);delete t.assegnazione[id];invalidaPartite(t);await salva(t);render();break;}
    case 'distribuisci':if(!conferma(t,'Ridistribuire i gironi azzera partite e tabellone. Continuare?'))break;distribuisci(t);invalidaPartite(t);await salva(t);render();break;
    case 'gen-partite':
      if(t.partite.length&&!confirm('Rigenerando i gironi tutti i risultati e il tabellone verranno azzerati. Continuare?'))break;
      if([...Array(t.nGironi)].some((_,g)=>membri(t,g).length<2)){toast('Ogni girone deve avere almeno 2 partecipanti',true);break;}
      generaPartite(t);await salva(t);S.tab='gironi';render();break;
    case 'gen-tab':
      if(t.tabellone&&!confirm('Il tabellone attuale e i suoi risultati verranno sostituiti. Continuare?'))break;
      if(!generaTabellone(t)){toast('Servono almeno 2 qualificati',true);break;}
      await salva(t);S.tab='tabellone';render();break;
    case 'reset-ris':if(!confirm('Azzerare tutti i risultati di gironi e tabellone?'))break;
      t.partite.forEach(m=>m.set=vuoti());t.tabellone=null;t.stato='gironi';await salva(t);render();break;
    case 'cal-add':{
      const data=val('c-data');if(!data){toast('Indica la data della partita',true);break;}
      t.calendario=t.calendario||[];
      t.calendario.push({id:Date.now().toString(36),data,ora:val('c-ora'),campo:val('c-campo').trim(),fase:val('c-fase'),incontro:val('c-inc').trim(),note:val('c-note').trim()});
      await salva(t);render();break;}
    case 'scarica-csv':if(!isOrg())break;scaricaFile(`galli-winter-cup_risultati_${dataFile()}.csv`,datiCSV(),'text/csv;charset=utf-8');toast('File preparato');break;
    case 'scarica-json':if(!isOrg())break;scaricaFile(`galli-winter-cup_copia-dati_${dataFile()}.json`,datiJSON(),'application/json');toast('File preparato');break;
    case 'cal-del':if(!confirm('Eliminare questa partita dal calendario?'))break;
      t.calendario=t.calendario.filter(c=>c.id!==el.dataset.id);await salva(t);render();break;
  }
});

document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el&&el.id==='c-fase'){const ti=cur(),inc=document.getElementById('c-inc');if(ti&&inc)inc.innerHTML=optIncontri(ti,el.value);return;}
const ch=el.dataset&&el.dataset.ch;if(!ch)return;const t=cur();
  if(ch==='set'){
    const v=el.value.replace(/\D/g,'').slice(0,2);let m;
    if(el.dataset.k==='g')m=t.partite.find(x=>x.id==el.dataset.m);
    else{const [r,i]=el.dataset.m.split('_').map(Number);m=t.tabellone.rounds[r][i];}
    m.set[+el.dataset.s][el.dataset.side==='a'?0:1]=v;
    if(t.tabellone)propaga(t);
    renderSoon();salva(t);
  }else if(ch==='nome'){
    const p=t.partecipanti.find(p=>p.id==el.dataset.id);p.nome=el.value.trim()||p.nome;renderSoon();salva(t);
  }else if(ch==='girone'){
    if(!conferma(t,'Spostare un partecipante di girone azzera partite e tabellone. Continuare?')){render();return;}
    t.assegnazione[+el.dataset.id]=+el.value;invalidaPartite(t);renderSoon();salva(t);
  }else if(ch==='ngironi'){
    if(!conferma(t,'Cambiare il numero di gironi azzera partite e tabellone. Continuare?')){render();return;}
    t.nGironi=+el.value;distribuisci(t);invalidaPartite(t);renderSoon();salva(t);
  }else if(ch==='qual'){
    t.qualificati=+el.value;renderSoon();salva(t);
  }
});

document.addEventListener('submit',ev=>{if(ev.target&&ev.target.id==='f-login'){ev.preventDefault();doLogin();}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&S.modal){S.modal=null;render();}
});

async function doLogin(){
  const u=val('l-u').trim(),p=val('l-p');S.lastEmail=u;
  if(!u||!p){S.err='Inserisci email e password.';render();return;}
  if(DEMO){if(p!=='prova'){S.err='Versione di prova: usa la password «prova».';render();return;}S.sess={u:u};S.modal=null;S.err='';render();toast('Accesso di prova effettuato');return;}
  S.loggingIn=true;
  try{
    await AUTH.signInWithEmailAndPassword(u,p);
    /* invio "reale" del modulo in un frame nascosto (verso about:blank, nessun dato esce dal telefono):
       serve perché iPhone/Android propongano di salvare la password nel portachiavi */
    try{const f=document.getElementById('f-login');if(f)f.submit();}catch(x){}
    await new Promise(r=>setTimeout(r,700));
    S.loggingIn=false;S.modal=null;S.err='';render();toast('Accesso effettuato');
  }
  catch(e){
    S.loggingIn=false;
    const c=e&&e.code||'';
    S.err=(c==='auth/too-many-requests')?'Troppi tentativi: riprova tra qualche minuto.':(c==='auth/network-request-failed')?'Connessione non disponibile.':'Email o password non corrette.';
    render();
  }
}

(async()=>{render();initFirebase();await carica();S.pronto=true;render();
  setInterval(()=>{if(!DEMO&&!S.sess&&!S.modal&&document.visibilityState==='visible'){carica().then(render);}},180000);})();
</script>
